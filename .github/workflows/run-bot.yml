name: Run Bot Wha

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

concurrency:
  group: wa-bot
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 190
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/cache@v4
        with:
          path: node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('package.json') }}

      - run: npm install --no-audit --no-fund

      - name: Run bot (auto restart + 3h slice)
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          BOT_NUMBER: ${{ secrets.BOT_NUMBER }}
          SESSION_ID: ${{ secrets.SESSION_ID || 'main' }}
          CONNECT_MODE: ${{ secrets.CONNECT_MODE || 'pair' }}
          CI_LOGIN: ${{ secrets.CI_LOGIN }}
        run: |
          set +e
          end=$(( $(date +%s) + 10500 ))
          while true; do
            left=$(( end - $(date +%s) ))
            [ "$left" -le 0 ] && exit 0
            timeout "${left}s" node index.js
            code=$?
            case $code in
              124) exit 0 ;;
              2)   echo "No saved session"; exit 2 ;;
              *)   echo "Bot exited ($code), restarting in 5s"; sleep 5 ;;
            esac
          done

      - name: Start next run
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run run-bot.yml --repo "${{ github.repository }}" --ref "${{ github.ref_name }}"
