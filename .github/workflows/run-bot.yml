name: GOD VOIP MD

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "0 */5 * * *"

concurrency:
  group: whatsapp-bot-main
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm install --omit=dev

      - name: Start bot
        env:
          BOT_NUMBER: ${{ secrets.BOT_NUMBER }}
          OWNER_NUMBER: ${{ secrets.OWNER_NUMBER }}
          SESSION_ID: ${{ secrets.SESSION_ID }}
          SESSION_KEY: ${{ secrets.SESSION_KEY }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          TOURL_API_KEY: ${{ secrets.TOURL_API_KEY }}
          TOURL_BASE_URL: ${{ secrets.TOURL_BASE_URL }}
          PREFIX: ${{ secrets.PREFIX }}
        run: |
          echo "GOD VOIP MD starting (pairing codes are suppressed in CI logs)"
          node index.js
