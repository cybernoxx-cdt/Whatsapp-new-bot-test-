name: GOD VOIP MD

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "0 */5 * * *"

# Prevent two runners from using the same WhatsApp session simultaneously.
concurrency:
  group: whatsapp-bot-main
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --omit=dev --no-audit --no-fund

      - name: Validate source syntax and security module
        run: |
          set -e
          find . -path ./node_modules -prune -o -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          npm run security-check
          echo "✅ JavaScript syntax and defensive security checks passed"

      - name: Validate required configuration
        env:
          BOT_NUMBER: ${{ secrets.BOT_NUMBER }}
          OWNER_NUMBER: ${{ secrets.OWNER_NUMBER }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          SESSION_ID: ${{ secrets.SESSION_ID }}
        run: |
          if [ -z "$BOT_NUMBER" ] && [ -z "$OWNER_NUMBER" ]; then
            echo "::error::Missing BOT_NUMBER or OWNER_NUMBER GitHub Secret. Add the WhatsApp number in international format (digits only) under Settings > Secrets and variables > Actions."
            exit 1
          fi
          if [ -z "$MONGODB_URI" ]; then
            echo "::error::Missing MONGODB_URI GitHub Secret."
            exit 1
          fi
          if [ -z "$SESSION_ID" ]; then
            echo "::warning::SESSION_ID is empty. A valid existing local session is required for headless GitHub Actions."
          fi
          echo "✅ Required configuration validated"

      - name: Start bot
        env:
          BOT_NUMBER: ${{ secrets.BOT_NUMBER }}
          OWNER_NUMBER: ${{ secrets.OWNER_NUMBER }}
          SESSION_ID: ${{ secrets.SESSION_ID }}
          SESSION_KEY: ${{ secrets.SESSION_KEY }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          DEFAULT_AUDIO_URL: ${{ secrets.DEFAULT_AUDIO_URL }}
          DEFAULT_VIDEO_URL: ${{ secrets.DEFAULT_VIDEO_URL }}
          PREFIX: ${{ secrets.PREFIX }}
          # Pairing codes are intentionally not printed to shared CI logs.
          GITHUB_ACTIONS: "true"
        run: |
          echo "GOD VOIP MD starting"
          node index.js
