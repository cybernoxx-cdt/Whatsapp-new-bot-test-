name: GOD VOIP MD

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "0 */5 * * *"

# Prevent two runners from using the same WhatsApp session simultaneously.
concurrency:
  group: whatsapp-bot-main
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --omit=dev --no-audit --no-fund

      - name: Validate source syntax and security module
        run: |
          set -e
          find . -path ./node_modules -prune -o -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          npm run security-check
          echo "✅ JavaScript syntax and defensive security checks passed"

      - name: Validate required configuration
        env:
          BOT_NUMBER: ${{ secrets.BOT_NUMBER }}
          SESSION_ID_1: ${{ secrets.SESSION_ID_1 }}
          SESSION_ID_2: ${{ secrets.SESSION_ID_2 }}
          SESSION_ID_3: ${{ secrets.SESSION_ID_3 }}
          SESSION_ID_4: ${{ secrets.SESSION_ID_4 }}
          SESSION_ID_5: ${{ secrets.SESSION_ID_5 }}
          SESSION_ID_6: ${{ secrets.SESSION_ID_6 }}
          SESSION_ID_7: ${{ secrets.SESSION_ID_7 }}
          SESSION_ID_8: ${{ secrets.SESSION_ID_8 }}
          SESSION_ID_9: ${{ secrets.SESSION_ID_9 }}
          SESSION_ID_10: ${{ secrets.SESSION_ID_10 }}
          BOT_NUMBER_2: ${{ secrets.BOT_NUMBER_2 }}
          BOT_NUMBER_3: ${{ secrets.BOT_NUMBER_3 }}
          BOT_NUMBER_4: ${{ secrets.BOT_NUMBER_4 }}
          BOT_NUMBER_5: ${{ secrets.BOT_NUMBER_5 }}
          BOT_NUMBER_6: ${{ secrets.BOT_NUMBER_6 }}
          BOT_NUMBER_7: ${{ secrets.BOT_NUMBER_7 }}
          BOT_NUMBER_8: ${{ secrets.BOT_NUMBER_8 }}
          BOT_NUMBER_9: ${{ secrets.BOT_NUMBER_9 }}
          BOT_NUMBER_10: ${{ secrets.BOT_NUMBER_10 }}
          OWNER_NUMBER: ${{ secrets.OWNER_NUMBER }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          SESSION_ID: ${{ secrets.SESSION_ID }}
          SESSION_ID_1: ${{ secrets.SESSION_ID_1 }}
          SESSION_ID_2: ${{ secrets.SESSION_ID_2 }}
          SESSION_ID_3: ${{ secrets.SESSION_ID_3 }}
          SESSION_ID_4: ${{ secrets.SESSION_ID_4 }}
          SESSION_ID_5: ${{ secrets.SESSION_ID_5 }}
          SESSION_ID_6: ${{ secrets.SESSION_ID_6 }}
          SESSION_ID_7: ${{ secrets.SESSION_ID_7 }}
          SESSION_ID_8: ${{ secrets.SESSION_ID_8 }}
          SESSION_ID_9: ${{ secrets.SESSION_ID_9 }}
          SESSION_ID_10: ${{ secrets.SESSION_ID_10 }}
        run: |
          if [ -z "$BOT_NUMBER" ] && [ -z "$OWNER_NUMBER" ]; then
            echo "::error::Missing BOT_NUMBER or OWNER_NUMBER GitHub Secret. Add the WhatsApp number in international format (digits only) under Settings > Secrets and variables > Actions."
            exit 1
          fi
          if [ -z "$MONGODB_URI" ]; then
            echo "::error::Missing MONGODB_URI GitHub Secret."
            exit 1
          fi
          if [ -z "$SESSION_ID" ] && [ -z "$SESSION_ID_1" ]; then
            echo "::warning::No SESSION_ID or SESSION_ID_1 secret found. Add at least one valid session for headless login."
          fi
          if [ -z "${{ secrets.DNUZ_API_KEY }}" ]; then
            echo "::warning::DNUZ_API_KEY is not available to this workflow. Add it under Settings > Secrets and variables > Actions, then rerun."
          else
            echo "✅ DNUZ_API_KEY secret is available to the workflow"
          fi
          echo "✅ Required configuration validated"

      - name: Start bot
        env:
          BOT_NUMBER: ${{ secrets.BOT_NUMBER }}
          OWNER_NUMBER: ${{ secrets.OWNER_NUMBER }}
          SESSION_ID: ${{ secrets.SESSION_ID }}
          SESSION_KEY: ${{ secrets.SESSION_KEY }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          DNUZ_API_KEY: ${{ secrets.DNUZ_API_KEY }}
          DNUZ_API_BASE: ${{ secrets.DNUZ_API_BASE }}
          DEFAULT_AUDIO_URL: ${{ secrets.DEFAULT_AUDIO_URL }}
          DEFAULT_VIDEO_URL: ${{ secrets.DEFAULT_VIDEO_URL }}
          PREFIX: ${{ secrets.PREFIX }}
          # Pairing codes are intentionally not printed to shared CI logs.
          GITHUB_ACTIONS: "true"
        run: |
          echo "GOD VOIP MD starting with workflow-level crash recovery"

          # Restart the Node.js bot whenever it exits unexpectedly.
          # GitHub Actions still enforces the job's 350-minute maximum runtime.
          delay=5
          max_delay=60

          while true; do
            echo "[$(date -u '+%Y-%m-%d %H:%M:%S UTC')] Starting GOD VOIP MD..."
            set +e
            node multi-session.js
            exit_code=$?
            set -e

            echo "[$(date -u '+%Y-%m-%d %H:%M:%S UTC')] Bot process exited (code: ${exit_code}). Restarting in ${delay}s..."
            sleep "$delay"

            delay=$((delay * 2))
            if [ "$delay" -gt "$max_delay" ]; then
              delay="$max_delay"
            fi
          done
